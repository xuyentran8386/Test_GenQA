<body>
    <h1>送料: 送料は全国一律660円（税込）、北海道・沖縄・離島は1,100円（税込）です。5,000円（税込）以上のご注文で送料無料になります。</h1>
    <p>発送日: 平日14時までのご注文は当日発送します。土日祝日は発送を行っておりません。</p>
    <p>お届け状況の確認: 発送完了メールに記載された追跡番号を、配送業者のサイトで入力するとお届け状況を確認できます。チャットボットに注文番号を入力して確認することもできます。</p>
    <p>同梱: 複数のご注文を1つにまとめて発送することはできません。ご注文ごとに送料がかかります。</p>
